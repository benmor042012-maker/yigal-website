name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main # שנה ל-master אם זה שם הענף הראשי שלך בשלט רחוק

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9  # הגרסה המעודכנת והיציבה ביותר ל-2026

      - name: Install dependencies
        run: pnpm install

      - name: Build and Deploy
        run: pnpm deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
